schema_version: 1
scenario_id: two_source_sparse_example
# Schema illustration only. Do not use Cartesian expansion as an acceptance
# design. Formal cases, starts, and seeds must be sparsely predeclared and
# sealed in a versioned manifest.
mode: simulation
bounds_m: [-2.0, 2.0, -2.0, 2.0]
room_center_m: [0.0, 0.0]
run_timeout_sec: 180.0

algorithm_profiles:
  - robust_gaussian_v1

repeats:
  deterministic_seeds: [101]

robot_starts:
  - [-1.5, -1.5, 0.0]

sources:
  positions:
    - [-0.75, 0.50]
    - [ 0.90, 0.75]
  level_grid:
    source_1: [2]
    source_2: [5]

disturbances:
  sensor_noise_std: 0.0
  sensor_delay_sec: 0.0
  pose_delay_sec: 0.0

recording:
  enabled: true
  topic_manifest: config/experiment_topics.yaml

success:
  controller_goal_score_threshold: 0.95
  evaluation_goal_position_tolerance_m: 0.35
