schema_version: 3
suite_id: phase08_v6_selected_repeats
description: Three fresh headless repeats of the selected H25 two-light local-recovery case.
mode: simulation
execution:
  max_parallel_runs: 1
  gazebo_gui: false
  runs_root: /home/mattb/Experiments/GESC-Gaussian/runs/phase08_v6
  preflight_timeout_sec: 150.0
  run_timeout_sec: 300.0
  wall_timeout_sec: 420.0
  shutdown_grace_sec: 45.0
  stop_on_run_failure: false
  stop_on_cleanup_failure: true
metadata:
  experiment_version: phase08-v6
  operator_notes: Frozen H25 repeatability stage; local 25 percent or nominal 400 lumens and global 100 percent or nominal 1600 lumens.
level_map: {}
defaults:
  bounds_m: [-2.0, 2.0, -2.0, 2.0]
  room_center_m: [0.0, 0.0]
  validation_world: true
  simulation_contacts_enabled: true
  disturbances:
    sensor_noise: {model: none, bound: 0.0}
    sensor_delay_sec: 0.0
    pose_delay_sec: 0.0
cases:
  - case_id: v6_h25_selected_repeats
    family: recenter_resume
    description: Frozen lowest eligible Hue ratio H25 with three fresh Gazebo seeds.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [17101, 17102, 17103]
    starts: [{id: route_start, x_m: -1.3, y_m: -0.2, yaw_rad: 0.0}]
    sources:
      - {id: local, x_m: -0.8, y_m: 0.0, relative_lumen_input: 400.0, evaluation_role: local_minimum}
      - {id: global, x_m: 1.3, y_m: 0.8, relative_lumen_input: 1600.0, evaluation_role: goal}
    algorithm:
      ablations:
        gaussian_fill_enabled: true
        affine_assist_enabled: false
        recenter_enabled: true
      launch_overrides:
        gaussian_fill_covariance_scale: 2.5
        gaussian_fill_amplitude_depth_scale: 1.5
        gaussian_fill_exit_sigma: 2.5
        stall_window_sec: 3.0
        minimum_radial_progress_m: 0.05
        goal_score_threshold: 0.95
        goal_score_rotation_period_sec: 3.0
        goal_score_required_rotations: 2
        goal_hold_sec: 3.0
        undesired_score_hold_sec: 3.0
        verification_max_sec: 12.0
        fill_design_timeout_sec: 5.0
        escape_max_sec: 20.0
        escape_exit_hold_sec: 1.0
        recenter_max_sec: 30.0
        recenter_tolerance_m: 0.25
        recenter_hold_sec: 1.0
        direction_lookahead_m: 0.5
        direction_candidate_step_rad: 0.7853981633974483
        wall_margin_m: 0.35
        fill_avoidance_margin_m: 0.1
        approach_history_window_sec: 0.5
    success:
      all_of:
        - recording_complete
        - cleanup_complete
        - required_state_path
        - required_events
        - no_forbidden_states
        - no_forbidden_events
        - collision_expectation
        - observed_local_recovery
      controller:
        contract_id: v6_h25_selected_repeats
        expected_verification_outcome: below_target_extremum
        reachability_argument: H25 was the lowest complete visible-sweep recovery and these fresh seeds retain its exact geometry, profile, startup, and parameters.
        expected_terminal_state: null
        required_state_path: [SEARCH, VERIFY_EXTREMUM, DESIGN_OR_MERGE_FILL, ESCAPE_REPULSE, RECENTER, SEARCH]
        required_events: [CONVERGENCE_CONFIRMED, FILL_CREATED, ESCAPE_STARTED, RECENTER_STARTED, RECENTER_COMPLETE]
        forbidden_states: [ESCAPE_ASSIST, FAILSAFE]
        forbidden_events: [FILL_REJECTED, FILL_DESIGN_FAILED, TIMEOUT, FAILSAFE]
      ground_truth:
        goal_source_ids: [global]
        final_position_tolerance_m: 0.35
      local_recovery:
        local_source_id: local
        global_source_id: global
        convergence_to_local_max_m: 0.60
        convergence_to_global_min_m: 0.75
        fill_to_convergence_max_m: 0.50
      collision_expected: false
