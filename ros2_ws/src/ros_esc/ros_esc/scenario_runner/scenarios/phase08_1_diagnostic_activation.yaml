  - case_id: activation_noise_delay_recenter
    family: noise_delay
    description: Preserve the below-target escape and recenter path under bounded noise and delays.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [8310]
    starts: [{id: center_northeast, x_m: 0.0, y_m: 0.0, yaw_rad: 0.7853981633974483}]
    sources:
      - {id: global_source, x_m: 1.0, y_m: 1.0, relative_lumen_input: 700.0, evaluation_role: goal}
    disturbances:
      sensor_noise: {model: uniform, bound: 0.001}
