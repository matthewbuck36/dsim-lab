    description: Force one bounded progress stall, redesign, and assisted escape entry.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [8306]
    starts: [{id: local_center, x_m: -0.7, y_m: -0.2, yaw_rad: 0.0}]
    sources:
      - {id: local, x_m: -0.7, y_m: -0.2, relative_lumen_input: 800.0, evaluation_role: local_minimum}
      - {id: goal, x_m: 1.4, y_m: 0.8, relative_lumen_input: 1900.0, evaluation_role: goal}
    algorithm:
      ablations: {}
      launch_overrides:
        <<: *diagnostic_parameters
        stall_window_sec: 1.0
        minimum_radial_progress_m: 5.0
    success:
      all_of:
        - recording_complete
        - cleanup_complete
        - required_state_path
        - required_events
        - no_forbidden_states
        - no_forbidden_events
        - collision_expectation
      controller:
        contract_id: activation_stalled_assist
        expected_verification_outcome: below_target_extremum
        reachability_argument: A 5 m progress requirement cannot be met in the bounded room; synthetic integration proves one stall-redesign transition into ASSIST.
        expected_terminal_state: null
        required_state_path: [SEARCH, VERIFY_EXTREMUM, DESIGN_OR_MERGE_FILL, ESCAPE_REPULSE, DESIGN_OR_MERGE_FILL, ESCAPE_ASSIST]
        required_events: [CONVERGENCE_CONFIRMED, FILL_CREATED, ESCAPE_STARTED, ESCAPE_STALLED]
        forbidden_states: [FAILSAFE]
        forbidden_events: [FILL_REJECTED, FILL_DESIGN_FAILED, TIMEOUT, FAILSAFE]
      ground_truth:
        goal_source_ids: [goal]
        final_position_tolerance_m: 0.35
      collision_expected: false

  - case_id: activation_fill_merge
    family: fill_merge
    description: Force a nearby redesign and require the typed merge lifecycle.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [8307]
    starts: [{id: southwest_northeast, x_m: -1.4, y_m: -1.0, yaw_rad: 0.5}]
    sources:
      - {id: local_a, x_m: -0.40, y_m: 0.0, relative_lumen_input: 700.0, evaluation_role: local_minimum}
      - {id: local_b, x_m: 0.15, y_m: 0.10, relative_lumen_input: 750.0, evaluation_role: local_minimum}
      - {id: goal, x_m: 1.5, y_m: 1.3, relative_lumen_input: 2100.0, evaluation_role: goal}
    algorithm:
      ablations: {}
      launch_overrides:
        <<: *diagnostic_parameters
        stall_window_sec: 1.0
        minimum_radial_progress_m: 5.0
        gaussian_fill_merge_bandwidth_m: 0.75
        gaussian_fill_merge_radius_scale: 2.5
    success:
      all_of:
        - recording_complete
        - cleanup_complete
        - required_state_path
        - required_events
        - required_event_sequence
