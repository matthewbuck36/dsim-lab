      collision_expected: false

  - case_id: activation_boundary_below_target
    family: boundary
    description: Classify and escape an isolated below-target source near the west wall without contact.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [8309]
    starts: [{id: west_wall_east, x_m: -1.45, y_m: 0.0, yaw_rad: 0.0}]
    sources:
      - {id: global_source, x_m: -0.6, y_m: 0.0, relative_lumen_input: 800.0, evaluation_role: goal}
