schema_version: 3
suite_id: phase08_2_recenter
description: One development-only proof of the corrected retained-fill recenter lifecycle.
mode: simulation
execution:
  max_parallel_runs: 1
  gazebo_gui: true
  preflight_timeout_sec: 150.0
  run_timeout_sec: 180.0
  wall_timeout_sec: 480.0
  shutdown_grace_sec: 30.0
  stop_on_run_failure: true
  stop_on_cleanup_failure: true
metadata:
  experiment_version: phase08.2-recenter
  operator_notes: Development evidence only; historical v1, v2, Phase 08.1, v3 acceptance, and physical hardware are excluded.
level_map: {"1": 450.0, "2": 800.0, "3": 1200.0, "4": 1800.0, "5": 2500.0}
defaults:
  bounds_m: [-2.0, 2.0, -2.0, 2.0]
  room_center_m: [0.0, 0.0]
  validation_world: true
  simulation_contacts_enabled: true
  disturbances:
    sensor_noise: {model: none, bound: 0.0}
    sensor_delay_sec: 0.0
    pose_delay_sec: 0.0
cases:
  - case_id: recenter_retained_fill_create
    family: recenter_resume
    description: Reproduce the retained fill/create geometry and require escape, recenter completion, and resumed search.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [8304]
    starts: [{id: local_center, x_m: -0.8, y_m: 0.0, yaw_rad: 0.0}]
    sources:
      - {id: local, x_m: -0.8, y_m: 0.0, relative_lumen_input: 700.0, evaluation_role: local_minimum}
      - {id: goal, x_m: 1.3, y_m: 0.8, relative_lumen_input: 1800.0, evaluation_role: goal}
    algorithm:
      ablations: {}
      launch_overrides:
        gaussian_fill_covariance_scale: 2.5
        gaussian_fill_amplitude_depth_scale: 1.5
        gaussian_fill_exit_sigma: 2.5
        stall_window_sec: 3.0
        minimum_radial_progress_m: 0.05
        goal_score_threshold: 0.95
        goal_score_rotation_period_sec: 3.0
        goal_score_required_rotations: 2
        goal_hold_sec: 3.0
        undesired_score_hold_sec: 3.0
        verification_max_sec: 12.0
    success:
      all_of:
        - recording_complete
        - cleanup_complete
        - required_state_path
        - required_events
        - no_forbidden_states
        - no_forbidden_events
        - collision_expectation
      controller:
        contract_id: recenter_retained_fill_create
        expected_verification_outcome: below_target_extremum
        reachability_argument: The retained Phase 08.1 run proved fill creation and escape; the Phase 08.2 deterministic regression closes the recenter geometry before this runtime proof.
        expected_terminal_state: null
        required_state_path: [SEARCH, VERIFY_EXTREMUM, DESIGN_OR_MERGE_FILL, ESCAPE_REPULSE, RECENTER, SEARCH]
        required_events: [CONVERGENCE_CONFIRMED, FILL_CREATED, ESCAPE_STARTED, RECENTER_STARTED, RECENTER_COMPLETE]
        forbidden_states: [FAILSAFE]
        forbidden_events: [FILL_REJECTED, FILL_DESIGN_FAILED, TIMEOUT, FAILSAFE]
      ground_truth:
        goal_source_ids: [goal]
        final_position_tolerance_m: 0.35
      collision_expected: false
