schema_version: 1
suite_id: brightness_percent_example
description: Percentage brightness input example; no behavioral acceptance claim.
mode: simulation
execution:
  max_parallel_runs: 1
  gazebo_gui: true
  runs_root: ~/Experiments/GESC-Gaussian/runs
  preflight_timeout_sec: 150.0
  run_timeout_sec: 30.0
  wall_timeout_sec: 300.0
  shutdown_grace_sec: 30.0
  stop_on_run_failure: false
  stop_on_cleanup_failure: true
metadata:
  experiment_version: brightness-percent-interface-v1
  operator_notes: 'Nominal linear simulation mapping: 100 percent = 1600 lumens; not
    measured Hue dimming calibration.'
level_map: {}
defaults:
  bounds_m:
  - -5.0
  - 5.0
  - -5.0
  - 5.0
  room_center_m:
  - 0.0
  - 0.0
  disturbances:
    sensor_noise:
      model: none
      bound: 0.0
    sensor_delay_sec: 0.0
    pose_delay_sec: 0.0
cases:
- case_id: two_lights_25_100_percent
  family: two_source
  description: Two lights set to 25 and 100 percent; infrastructure-only example.
  status: executable_unverified
  profiles:
  - robust_gaussian_v1
  seeds:
  - 1001
  starts:
  - id: center_east
    x_m: 0.0
    y_m: 0.0
    yaw_rad: 0.0
  sources:
  - id: local
    x_m: 1.0
    y_m: 0.5
    brightness_percent: 25.0
    evaluation_role: local_minimum
  - id: goal
    x_m: 3.5
    y_m: 3.5
    brightness_percent: 100.0
    evaluation_role: goal
  algorithm:
    ablations:
      gaussian_fill_enabled: true
      affine_assist_enabled: true
      recenter_enabled: true
    launch_overrides: {}
  success:
    all_of:
    - recording_complete
    - cleanup_complete
    controller:
      expected_terminal_state: null
      required_state_sequence: []
      required_events: []
      forbidden_events: []
    ground_truth:
      goal_source_ids:
      - goal
      final_position_tolerance_m: 0.35
    minimum_saturation_samples: 0
