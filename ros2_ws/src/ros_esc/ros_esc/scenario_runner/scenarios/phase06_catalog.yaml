schema_version: 1
suite_id: phase06_catalog
description: Phase 06 supported-unverified coverage catalog and explicit gaps.
mode: simulation

execution:
  max_parallel_runs: 1
  gazebo_gui: false
  runs_root: ~/Experiments/GESC-Gaussian/runs
  preflight_timeout_sec: 150.0
  run_timeout_sec: 180.0
  wall_timeout_sec: 480.0
  shutdown_grace_sec: 30.0
  stop_on_run_failure: false
  stop_on_cleanup_failure: true

metadata:
  experiment_version: phase06-v1
  operator_notes: Phase 06 catalog; empirical expectations are not yet tuned.

level_map: {}

defaults:
  bounds_m: [-2.0, 2.0, -2.0, 2.0]
  room_center_m: [0.0, 0.0]
  disturbances:
    sensor_noise: {model: none, bound: 0.0}
    sensor_delay_sec: 0.0
    pose_delay_sec: 0.0

cases:
  - case_id: two_source_separation
    family: two_source
    description: Large, medium, close, and overlapping two-source geometries.
    status: executable_unverified
    profiles: [legacy, robust_gaussian_v1]
    seeds: [6101]
    starts:
      - {id: center_east, x_m: 0.0, y_m: 0.0, yaw_rad: 0.0}
      - {id: southwest_north, x_m: -1.2, y_m: -1.2, yaw_rad: 1.5707963267948966}
      - {id: northwest_south, x_m: -1.2, y_m: 1.2, yaw_rad: -1.5707963267948966}
      - {id: southeast_west, x_m: 1.2, y_m: -1.2, yaw_rad: 3.141592653589793}
      - {id: northeast_west, x_m: 1.2, y_m: 1.2, yaw_rad: 3.141592653589793}
    sources:
      - {id: local, x_m: -0.75, y_m: 0.0, relative_lumen_input: 600.0, evaluation_role: local_minimum}
      - {id: goal, x_m: 1.25, y_m: 0.0, relative_lumen_input: 1800.0, evaluation_role: goal}
    algorithm:
      ablations: {gaussian_fill_enabled: true, affine_assist_enabled: true, recenter_enabled: true}
      launch_overrides: {}
    success:
      all_of: [recording_complete, cleanup_complete]
      controller: {expected_terminal_state: null, required_state_sequence: [], required_events: [], forbidden_events: [FAILSAFE]}
      ground_truth: {goal_source_ids: [goal], final_position_tolerance_m: 0.35}
      minimum_saturation_samples: 0

  - case_id: overlapping_close_minima
    family: close_minimum
    description: Close residual minima and overlapping attraction regions.
    status: executable_unverified
    profiles: [robust_gaussian_v1]
    seeds: [6102]
    starts:
      - {id: south_north, x_m: 0.0, y_m: -1.4, yaw_rad: 1.5707963267948966}
    sources:
      - {id: local_a, x_m: -0.20, y_m: 0.10, relative_lumen_input: 850.0, evaluation_role: local_minimum}
