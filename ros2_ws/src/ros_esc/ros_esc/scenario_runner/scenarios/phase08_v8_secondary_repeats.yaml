          - CONVERGENCE_CONFIRMED
          - FILL_CREATED
          - ESCAPE_STARTED
          - GOAL_REACHED
        required_event_sequence:
          - CONVERGENCE_CONFIRMED
          - FILL_CREATED
          - ESCAPE_STARTED
          - CONVERGENCE_CONFIRMED
          - GOAL_REACHED
        forbidden_states: [RECENTER, ESCAPE_ASSIST, FAILSAFE]
        forbidden_events:
          - FILL_REJECTED
          - FILL_MERGED
          - FILL_SUPERSEDED
          - FILL_DESIGN_FAILED
          - ESCAPE_STALLED
          - TIMEOUT
          - FAILSAFE
