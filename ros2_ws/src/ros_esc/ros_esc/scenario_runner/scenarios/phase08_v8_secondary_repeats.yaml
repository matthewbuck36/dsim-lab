        proximity_radius_m: 0.50
      staged_recovery:
        local_source_ids: [local]
        global_source_id: global
        convergence_to_local_max_m: 0.60
        convergence_to_global_min_m: 0.75
        fill_to_convergence_max_m: 0.50
        global_proximity_radius_m: 0.50
        local_association_mode: declared_source
        stage_a_timeout_sec: 360.0
        post_stage_a_timeout_sec: 180.0
      result_scopes:
        full_lifecycle:
          anchor_state: SEARCH
          boundary_state: null
          graceful_stop: false
          all_of: *all_of
